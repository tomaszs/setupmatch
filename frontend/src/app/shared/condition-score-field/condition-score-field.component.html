<mat-form-field appearance="outline" class="condition-input">
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    type="number"
    step="0.01"
    min="0"
    max="1"
    [disabled]="disabled"
    [value]="value ?? ''"
    (input)="onInputChange($any($event.target).value)"
    (blur)="markTouched()"
  />
</mat-form-field>

<div class="condition-controls">
  <button type="button" class="pill pill-step" [disabled]="disabled" (click)="adjust(-0.01)">
    -0.01
  </button>
  @for (preset of conditionPresets; track preset) {
    <button
      type="button"
      class="pill pill-preset"
      [class.pill-active]="isPresetActive(preset)"
      [disabled]="disabled"
      (click)="setPreset(preset)"
    >
      {{ formatPreset(preset) }}
    </button>
  }
  <button type="button" class="pill pill-step" [disabled]="disabled" (click)="adjust(0.01)">
    +0.01
  </button>
</div>
