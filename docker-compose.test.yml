name: setupmatch-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: setupmatch
      POSTGRES_USER: setupmatch
      POSTGRES_PASSWORD: setupmatch
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setupmatch -d setupmatch"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
