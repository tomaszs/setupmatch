name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: setupmatch
          POSTGRES_USER: setupmatch
          POSTGRES_PASSWORD: setupmatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setupmatch -d setupmatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run backend tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/setupmatch
          SPRING_DATASOURCE_USERNAME: setupmatch
          SPRING_DATASOURCE_PASSWORD: setupmatch
        run: chmod +x gradlew && ./gradlew test --no-daemon

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Puppeteer Chromium for Karma
        working-directory: frontend
        run: npx puppeteer browsers install chrome

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  e2e:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up -d --wait

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: e2e
        run: npm test

      - name: Stop application stack
        if: always()
        run: docker compose down -v
